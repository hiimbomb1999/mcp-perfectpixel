name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history so `gitleaks git` scans every commit, not just the
      # pushed one (checkout's default shallow clone would hide older leaks).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Secret scanning — fails the build if a leak is detected. Runs the
      # pinned gitleaks binary directly instead of gitleaks-action: that
      # action's license check flips to "license required" (hard fail) whenever
      # its GitHub user lookup fails or returns an unexpected type, which
      # breaks CI even with zero leaks in the repo.
      - name: Run Gitleaks
        run: |
          curl -sL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          /tmp/gitleaks git --redact --exit-code=1 --no-banner

      # pnpm version comes from the root package.json "packageManager" field
      # (single source of truth — don't also set `version:` here).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @mcp-perfectpixel/core exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # Runs the suite again with V8 coverage; the e2e tests reuse the Chromium
      # installed above (no PLAYWRIGHT_BROWSERS_PATH override needed here).
      - name: Coverage
        run: pnpm exec vitest run --coverage

      # Uploads the coverage report (coverage/clover.xml) to Codecov. No token
      # configured → no-op.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
