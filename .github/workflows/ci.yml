name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Secret scanning — fails the build if a leak is detected.
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # pnpm version comes from the root package.json "packageManager" field
      # (single source of truth — don't also set `version:` here).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @mcp-perfectpixel/core exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # Runs the suite again with V8 coverage; the e2e tests reuse the Chromium
      # installed above (no PLAYWRIGHT_BROWSERS_PATH override needed here).
      - name: Coverage
        run: pnpm exec vitest run --coverage

      # Uploads the coverage report (coverage/clover.xml) to Codecov. No token
      # configured → no-op.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
