name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Needed for npm Trusted Publishing (OIDC) — publish with `--provenance`
      # and NO token. npm deprecated bypass-2FA granular access tokens in
      # July 2026, so token-based publishing now requires an OTP that CI
      # cannot provide.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the root package.json "packageManager" field
      # (single source of truth — don't also set `version:` here).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @mcp-perfectpixel/core exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Verify tag matches package versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          for pkg in packages/core packages/server; do
            PKG_VERSION="$(node -p "require('./$pkg/package.json').version")"
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "Tag v$TAG_VERSION does not match $pkg version $PKG_VERSION" >&2
              exit 1
            fi
          done

      # Core must publish first: the server tarball depends on
      # @mcp-perfectpixel/core@<version> (workspace:* is rewritten on pack).
      # Trusted Publishing (OIDC): no NPM_TOKEN, no OTP — the npm CLI exchanges
      # the GitHub Actions OIDC token automatically. Each package must have a
      # trusted publisher configured on npmjs.com with subject
      #   repo:hiimbomb1999/mcp-perfectpixel:ref:refs/tags/v*
      - name: Publish @mcp-perfectpixel/core
        run: pnpm --filter @mcp-perfectpixel/core publish --access public --no-git-checks --provenance

      - name: Publish mcp-perfectpixel
        run: pnpm --filter mcp-perfectpixel publish --access public --no-git-checks --provenance

      # Regression guard: a previous release was accidentally published via
      # plain `npm publish` from the source folder, shipping a tarball whose
      # dependency was still "workspace:*" — broken for every consumer. Verify
      # the freshly published server actually installs and answers the MCP
      # initialize handshake before the workflow turns green.
      - name: Verify published package installs and runs
        run: |
          sleep 15  # registry propagation
          VERSION="$(node -p "require('./packages/server/package.json').version")"
          {
            printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}}}'
            sleep 3
          } | npx -y "mcp-perfectpixel@${VERSION}" | grep -q '"serverInfo"'
